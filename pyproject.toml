[project]
name = "physics-arcade"
version = "0.1.0"
description = "Classic physics games as benchmarks for world-model physical prediction"
authors = [
    { name = "ruifangzhang", email = "r.zhang@student.tudelft.nl" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pymunk>=7.3.1",
    "scipy>=1.18.1",
]

[project.scripts]
physics-arcade = "physics_arcade.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
